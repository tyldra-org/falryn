name: Bug report
description: Report behavior that differs from the expected result.
title: "fix: "
labels:
  - "bug"
body:
  - type: markdown
    attributes:
      value: |
        Please do not disclose vulnerabilities here; use the private security
        reporting path in SECURITY.md. A triager adds each valid issue to the
        Falryn Roadmap exactly once, assigns one owner and milestone, sets
        Status to Todo, selects P0–P3 Priority and current Readiness, applies
        an area label, and records a native parent or Standalone relationship.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands, input, or a small fixture where safe.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Falryn revision, OS, terminal, runtime, provider, and relevant configuration.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Primary area
      description: A triager applies the matching `area:*` label.
      options:
        - Runtime and application
        - CLI and headless use
        - Providers and models
        - Terminal UI
        - Language intelligence
        - Tools and execution
        - Context and compression
        - Data, persistence, and artifacts
        - Memory
        - Agents and workflows
        - Extensions and marketplace
        - Web and browser
        - Performance
        - Release and compatibility
        - Security and privacy
        - Documentation
    validations:
      required: true
  - type: dropdown
    id: relationship
    attributes:
      label: Planning relationship
      description: Choose Standalone or link the native parent in the next field.
      options:
        - Standalone
        - Native child of an existing parent
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: Native parent issue
      description: Required when this is a child; otherwise write Standalone.
      placeholder: "#123 or Standalone"
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and blockers
      description: Link exact blocking issues, or write None.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation and documentation impact
      description: Name the regression checks and any affected public documentation.
    validations:
      required: true
  - type: checkboxes
    id: readiness
    attributes:
      label: Ready checklist
      description: Leave an item unchecked until its evidence is known; a triager sets the authoritative Project Readiness field.
      options:
        - label: The reproduction and current source baseline are verified.
        - label: The correction fits one focused pull request and names its owner boundaries.
        - label: Failure, regression, cancellation, recovery, and product wiring are explicit.
        - label: Focused validation and documentation impact are testable.
