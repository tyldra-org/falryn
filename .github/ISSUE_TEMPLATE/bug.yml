name: Bug report
description: Report behavior that differs from the expected result.
title: "fix: "
labels:
  - "bug"
body:
  - type: markdown
    attributes:
      value: |
        Please do not disclose vulnerabilities here; use the private security
        reporting path in SECURITY.md. This public report does not need an
        assignee, milestone, Priority, Readiness, or access to the private
        Falryn Roadmap. Maintainers decide separately whether to adopt an issue
        into the product-development plan. A focused correction may use the
        public contribution path without private planning metadata.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: State the user-visible correction and the boundary this issue owns.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands, input, or a small fixture where safe.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Falryn revision, OS, terminal, runtime, provider, and relevant configuration.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Failure and recovery boundary
      description: Describe relevant limits, cancellation, partial effects, stale state, cleanup, and recovery.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Primary area
      description: Repository automation applies the matching `area:*` label.
      options:
        - Runtime and application
        - CLI and headless use
        - Providers and models
        - Terminal UI
        - Language intelligence
        - Tools and execution
        - Context and compression
        - Data, persistence, and artifacts
        - Memory
        - Agents and workflows
        - Extensions and marketplace
        - Web and browser
        - Performance
        - Release and compatibility
        - Security and privacy
        - Documentation
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and blockers
      description: Link exact blocking issues, or write None.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Completion proof
      description: Name the regression checks, negative controls, and observed result that prove the correction.
    validations:
      required: true
  - type: textarea
    id: documentation
    attributes:
      label: Documentation impact
      description: Record applicable public-code-adjacent-update, private-update-required, private-verify-unaffected, private-verification-unavailable, or not-applicable results and why.
    validations:
      required: true
  - type: checkboxes
    id: readiness
    attributes:
      label: Contribution checklist
      description: Complete these before opening a non-draft correction pull request. They do not represent private Roadmap readiness.
      options:
        - label: The reproduction and current source baseline are verified.
        - label: The correction fits one focused pull request and names its owner boundaries.
        - label: Failure, regression, cancellation, recovery, and product wiring are explicit.
        - label: Focused validation and documentation impact are testable.
