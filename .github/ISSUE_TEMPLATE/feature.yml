name: Feature
description: Propose one user-visible capability or meaningful improvement.
title: "feat: "
labels:
  - "type: feature"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an improvement. Before implementation, a triager
        adds the issue to the Falryn Roadmap exactly once, assigns one owner
        and milestone, sets Status to Todo, selects P0–P3 Priority and current
        Readiness, applies an area label, and records a native parent or
        Standalone relationship. See CONTRIBUTING.md for the required workflow.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What user outcome should change, and who owns it?
      placeholder: As a …, I can …, so that …
    validations:
      required: true
  - type: textarea
    id: baseline
    attributes:
      label: Observed baseline and remaining change
      description: State what the current source does and the exact remaining delta.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: State what is included and deliberately excluded.
    validations:
      required: true
  - type: textarea
    id: contracts
    attributes:
      label: Contracts and product wiring
      description: Name inputs, outputs, state, effects, owner boundaries, and the real CLI, OpenTUI, headless, model, export, replay, or diagnostic composition point.
    validations:
      required: true
  - type: textarea
    id: failures
    attributes:
      label: Limits, failures, and recovery
      description: Cover relevant limits, invalid, partial, cancelled, unavailable, stale, cleanup, and recovery behavior.
    validations:
      required: true
  - type: textarea
    id: completion
    attributes:
      label: Completion proof
      description: List observable acceptance criteria, edge cases, and evidence that completes this issue.
      placeholder: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and blockers
      description: Link exact blocking issues, or write None.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Primary area
      description: A triager applies the matching `area:*` label.
      options:
        - Runtime and application
        - CLI and headless use
        - Providers and models
        - Terminal UI
        - Language intelligence
        - Tools and execution
        - Context and compression
        - Data, persistence, and artifacts
        - Memory
        - Agents and workflows
        - Extensions and marketplace
        - Web and browser
        - Performance
        - Release and compatibility
        - Security and privacy
        - Documentation
    validations:
      required: true
  - type: dropdown
    id: relationship
    attributes:
      label: Planning relationship
      description: Choose Standalone or link the native parent in the next field.
      options:
        - Standalone
        - Native child of an existing parent
        - Parent outcome with PR-sized children to be planned
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: Native parent issue
      description: Required when this is a child; otherwise write Standalone.
      placeholder: "#123 or Standalone"
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Name focused positive, negative, restart, resource, and platform checks.
    validations:
      required: true
  - type: textarea
    id: documentation
    attributes:
      label: Documentation impact
      description: Record applicable public-code-adjacent-update, private-update-required, private-verify-unaffected, private-verification-unavailable, or not-applicable results and why.
    validations:
      required: true
  - type: checkboxes
    id: readiness
    attributes:
      label: Ready checklist
      description: Leave an item unchecked until its evidence is known; a triager sets the authoritative Project Readiness field.
      options:
        - label: The current source baseline and remaining delta are verified.
        - label: The scope fits one focused pull request and names its owner boundaries.
        - label: Limits, failures, cancellation, recovery, and product wiring are explicit.
        - label: Focused validation and documentation impact are testable.
