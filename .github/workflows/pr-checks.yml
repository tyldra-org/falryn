name: Pull request checks

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

# The policy comes from the trusted base revision and runs with a read-only token.
permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate contribution metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Check the pull request and its owning issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // A base revision older than this entry point has no trusted policy to run.
            const path = "./.github/scripts/contribution-policy.cjs";
            const policy = require("node:fs").existsSync(path) ? require(path) : null;
            if (typeof policy?.pullRequestErrors !== "function") {
              core.notice("The base revision predates the trusted pull-request policy; nothing to run.");
              return;
            }
            const errors = await policy.pullRequestErrors(github, context.repo, context.payload.pull_request);
            if (errors.length > 0) {
              core.setFailed(`Update the pull request contract:\n- ${errors.join("\n- ")}`);
            }
