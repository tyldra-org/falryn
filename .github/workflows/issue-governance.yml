name: Issue governance

on:
  issues:
    types:
      [opened, edited, reopened, closed, assigned, unassigned, labeled, unlabeled, milestoned, demilestoned]

concurrency:
  group: issue-governance-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  validate:
    name: Check live issue metadata
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Report missing ownership or Roadmap metadata
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const policy = require("./.github/scripts/contribution-policy.cjs");
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            let labels = issue.labels.map((label) => label.name);
            const requestedWorkType = policy.requestedWorkType(issue.body);
            if (requestedWorkType !== null) {
              for (const label of labels.filter(
                (name) => (name === "bug" || name.startsWith("type:")) && name !== requestedWorkType,
              )) {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issue.number,
                  name: label,
                });
              }
              labels = labels.filter(
                (name) => !(name === "bug" || name.startsWith("type:")) || name === requestedWorkType,
              );
              if (!labels.includes(requestedWorkType)) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issue.number,
                  labels: [requestedWorkType],
                });
                labels.push(requestedWorkType);
              }
            }

            const requestedArea = policy.requestedArea(issue.body);
            if (requestedArea !== null && !labels.includes(requestedArea)) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issue.number,
                labels: [requestedArea],
              });
              labels.push(requestedArea);
            }
            issue.labels = labels.map((name) => ({ name }));
            const contributorErrors = policy.validateIssueContract(issue);
            const maintainerErrors = policy.validateIssueMetadata(issue);
            const errors = [...contributorErrors, ...maintainerErrors];

            const marker = "<!-- falryn-issue-governance -->";
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issue.number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user.type === "Bot" && comment.body.includes(marker),
            );

            if (errors.length === 0) {
              if (existing) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
              }
              return;
            }

            const contributorSection = contributorErrors.length === 0
              ? "- [x] The public issue-form contract is complete."
              : contributorErrors.map((error) => `- [ ] ${error}`).join("\n");
            const maintainerSection = [
              ...maintainerErrors.map((error) => `- [ ] ${error}`),
              "- [ ] Reconcile exactly one Roadmap item. A new open leaf defaults to Status **Todo**, Priority **P2**, and Readiness **Needs Planning**; preserve verified active or specialized values instead of resetting existing work.",
            ].join("\n");
            const body = `${marker}\nThis issue has two separate readiness lanes. Contributors do not need milestone or private Project permissions.\n\n### Contributor-owned public contract\n\n${contributorSection}\n\n### Maintainer-only triage\n\n${maintainerSection}\n\nAfter completing the public fields, wait for a maintainer to finish assignment and scheduling. See the [triage contract](https://github.com/tyldra-org/falryn/blob/main/CONTRIBUTOR-READINESS.md#triage-contract) and [field meanings](https://github.com/tyldra-org/falryn/blob/main/.agents/skills/falryn-workflow/references/roadmap-fields.md).`;
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
            }
