name: Pull request metadata

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate contribution metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check issue link and review context
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            const author = pullRequest.user.login;
            if (author === "dependabot[bot]" || author === "yogeshprasad098") return;

            const body = pullRequest.body ?? "";
            const missing = [];
            const conventionalTitle = /^(?:build|chore|ci|docs|feat|fix|perf|refactor|revert|test)(?:\([A-Za-z0-9._/-]+\))?!?: .+$/;
            if (!conventionalTitle.test(pullRequest.title)) {
              missing.push("a conventional PR title such as `feat(tui): add search` or `fix: preserve exit status`");
            }
            const issueReference = /\b(?:closes?|fix(?:es|ed)?|resolves?|refs?)\s+(?:[\w.-]+\/[\w.-]+)?#\d+/i;
            if (!issueReference.test(body)) {
              missing.push("an issue reference such as `Closes #123` or `Refs #123`");
            }

            for (const heading of [
              "## Target and outcome",
              "## Scope",
              "## Validation",
              "## Documentation",
              "## Risk and limitations",
            ]) {
              if (!body.includes(heading)) missing.push(`the ${heading} section`);
            }

            if (missing.length > 0) {
              core.setFailed(`Update the pull request template: ${missing.join(", ")}.`);
            }
