name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, typecheck, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun from package.json
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: package.json

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Verify direct dependency and generated-output ownership
        run: bun run verify:repository

      - name: Run Biome quality checks
        run: bun run quality

      - name: Run the strict TypeScript check
        run: bun run typecheck

      - name: Build the standalone executable
        run: bun run build

      - name: Run the complete test suite
        run: bun run test

  macos-arm64-compiled-smoke:
    name: macOS arm64 compiled smoke
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun from package.json
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: package.json

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build the macOS arm64 standalone executable
        run: bun run build:macos-arm64

      - name: Run the macOS arm64 compiled smoke suites
        run: bun run smoke:macos-arm64

  macos-arm64-benchmark-regression:
    name: macOS arm64 benchmark regression
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Bun for the reviewed revision
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: package.json

      - name: Install the reviewed revision's locked dependencies
        run: bun install --frozen-lockfile

      - name: Build the reviewed macOS arm64 executable
        run: bun run build:macos-arm64

      - name: Check out the pull request base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline

      - name: Set up Bun for the base revision
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: baseline/package.json

      - name: Install the base revision's locked dependencies
        working-directory: baseline
        run: bun install --frozen-lockfile

      - name: Build the base macOS arm64 executable
        working-directory: baseline
        run: bun run build:macos-arm64

      - name: Add the test-only report harness to the base checkout
        run: |
          cp src/data/measurement.test.ts baseline/src/data/measurement.test.ts
          cp tools/benchmark-regression.ts baseline/tools/benchmark-regression.ts

      - name: Warm the base revision before its first report
        id: base_first_warmup
        continue-on-error: true
        working-directory: baseline
        run: |
          bun run measure
          bun run measure
          echo "completed=2" >> "$GITHUB_OUTPUT"

      - name: Measure the base revision first
        id: base_first_measurement
        continue-on-error: true
        working-directory: baseline
        env:
          FALRYN_MEASURE_REPORT: ${{ runner.temp }}/falryn-benchmark-reports/base-first.json
          FALRYN_BENCHMARK_REVISION: ${{ github.event.pull_request.base.sha }}
          FALRYN_BENCHMARK_TRIAL: base-first
          FALRYN_BENCHMARK_WARMUP_RUNS: ${{ steps.base_first_warmup.outputs.completed || 0 }}
        run: |
          mkdir -p "$RUNNER_TEMP/falryn-benchmark-reports"
          bun run measure && echo "completed=1" >> "$GITHUB_OUTPUT"

      - name: Move the base checkout outside reviewed test discovery
        run: mv baseline "$RUNNER_TEMP/falryn-benchmark-baseline"

      - name: Warm the reviewed revision before its first report
        id: candidate_first_warmup
        continue-on-error: true
        run: |
          bun run measure
          bun run measure
          echo "completed=2" >> "$GITHUB_OUTPUT"

      - name: Measure the reviewed revision first
        id: candidate_first_measurement
        continue-on-error: true
        env:
          FALRYN_MEASURE_REPORT: ${{ runner.temp }}/falryn-benchmark-reports/candidate-first.json
          FALRYN_BENCHMARK_REVISION: ${{ github.event.pull_request.head.sha }}
          FALRYN_BENCHMARK_TRIAL: candidate-first
          FALRYN_BENCHMARK_WARMUP_RUNS: ${{ steps.candidate_first_warmup.outputs.completed || 0 }}
        run: bun run measure && echo "completed=1" >> "$GITHUB_OUTPUT"

      - name: Warm the reviewed revision before its second report
        id: candidate_second_warmup
        continue-on-error: true
        run: |
          bun run measure
          bun run measure
          echo "completed=2" >> "$GITHUB_OUTPUT"

      - name: Measure the reviewed revision second
        id: candidate_second_measurement
        continue-on-error: true
        env:
          FALRYN_MEASURE_REPORT: ${{ runner.temp }}/falryn-benchmark-reports/candidate-second.json
          FALRYN_BENCHMARK_REVISION: ${{ github.event.pull_request.head.sha }}
          FALRYN_BENCHMARK_TRIAL: candidate-second
          FALRYN_BENCHMARK_WARMUP_RUNS: ${{ steps.candidate_second_warmup.outputs.completed || 0 }}
        run: bun run measure && echo "completed=1" >> "$GITHUB_OUTPUT"

      - name: Warm the base revision before its second report
        id: base_second_warmup
        continue-on-error: true
        working-directory: ${{ runner.temp }}/falryn-benchmark-baseline
        run: |
          bun run measure
          bun run measure
          echo "completed=2" >> "$GITHUB_OUTPUT"

      - name: Measure the base revision second
        id: base_second_measurement
        continue-on-error: true
        working-directory: ${{ runner.temp }}/falryn-benchmark-baseline
        env:
          FALRYN_MEASURE_REPORT: ${{ runner.temp }}/falryn-benchmark-reports/base-second.json
          FALRYN_BENCHMARK_REVISION: ${{ github.event.pull_request.base.sha }}
          FALRYN_BENCHMARK_TRIAL: base-second
          FALRYN_BENCHMARK_WARMUP_RUNS: ${{ steps.base_second_warmup.outputs.completed || 0 }}
        run: bun run measure && echo "completed=1" >> "$GITHUB_OUTPUT"

      - name: Compare the reports
        if: always()
        env:
          FALRYN_BENCHMARK_BASE_FIRST_REPORT: ${{ runner.temp }}/falryn-benchmark-reports/base-first.json
          FALRYN_BENCHMARK_CANDIDATE_FIRST_REPORT: ${{ runner.temp }}/falryn-benchmark-reports/candidate-first.json
          FALRYN_BENCHMARK_CANDIDATE_SECOND_REPORT: ${{ runner.temp }}/falryn-benchmark-reports/candidate-second.json
          FALRYN_BENCHMARK_BASE_SECOND_REPORT: ${{ runner.temp }}/falryn-benchmark-reports/base-second.json
          FALRYN_BENCHMARK_BASE_FIRST_COMPLETED: ${{ steps.base_first_measurement.outputs.completed || 0 }}
          FALRYN_BENCHMARK_CANDIDATE_FIRST_COMPLETED: ${{ steps.candidate_first_measurement.outputs.completed || 0 }}
          FALRYN_BENCHMARK_CANDIDATE_SECOND_COMPLETED: ${{ steps.candidate_second_measurement.outputs.completed || 0 }}
          FALRYN_BENCHMARK_BASE_SECOND_COMPLETED: ${{ steps.base_second_measurement.outputs.completed || 0 }}
        run: bun run benchmark:compare

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-arm64-benchmark-reports-${{ github.run_id }}
          path: ${{ runner.temp }}/falryn-benchmark-reports
          if-no-files-found: warn
