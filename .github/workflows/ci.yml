name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Check formatting
        run: bun run format:check

  lint:
    name: Lint and import organization
    needs: format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Run Biome quality checks
        run: bun run quality

  typecheck:
    name: TypeScript
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Run the strict TypeScript check
        run: bun run typecheck

  dependency-integrity:
    name: Dependency integrity
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Verify direct dependency and generated-output ownership
        run: bun run verify:repository

      - name: Verify the vendored skill trees match
        run: bun run verify:skills

      - name: Verify the agent instruction files match
        run: bun run verify:instructions

  dependency-audit:
    name: Dependency advisory audit
    needs: dependency-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Audit installed dependencies for known vulnerabilities
        run: bun audit

  platform-test:
    name: Platform tests (${{ matrix.name }})
    needs:
      - typecheck
      - dependency-integrity
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu latest x64
            runner: ubuntu-latest
            command: bun run test
          - name: macOS latest arm64
            runner: macos-latest
            command: bun run test
          - name: Windows latest x64
            runner: windows-latest
            command: bun run test:platform-baseline

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Run the platform test command
        run: ${{ matrix.command }}

  linux-compiled-smoke:
    name: Linux compiled CLI smoke
    needs:
      - typecheck
      - dependency-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Build the standalone executable
        run: bun run build

      - name: Run the compiled CLI smoke suite
        run: bun test src/main.compiled.test.ts

  macos-arm64-compiled-smoke:
    name: macOS arm64 compiled smoke
    needs:
      - typecheck
      - dependency-integrity
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Build the macOS arm64 standalone executable
        run: bun run build:macos-arm64

      - name: Run the macOS arm64 compiled smoke suites
        run: bun run smoke:macos-arm64

  windows-x64-compiled-smoke:
    name: Windows x64 compiled smoke
    needs:
      - typecheck
      - dependency-integrity
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Build the Windows x64 standalone executable
        run: bun run build:windows-x64

      # The CLI smoke only. The compiled terminal suite allocates a
      # pseudo-terminal through libc's `openpty`, which Windows has no
      # equivalent for, so it stays a POSIX qualification rather than being
      # skipped here and mistaken for coverage.
      - name: Run the Windows x64 compiled smoke suite
        run: bun run smoke:windows-x64
