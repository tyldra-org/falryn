name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Check formatting
        run: bun run format:check

  lint:
    name: Lint and import organization
    needs: format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Run Biome quality checks
        run: bun run quality

  typecheck:
    name: TypeScript
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Run the strict TypeScript check
        run: bun run typecheck

  dependency-integrity:
    name: Dependency integrity
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Verify direct dependency and generated-output ownership
        run: bun run verify:repository

  dependency-audit:
    name: Dependency advisory audit
    needs: dependency-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Audit installed dependencies for known vulnerabilities
        run: bun audit

  platform:
    name: Platform and compiled (${{ matrix.name }})
    needs:
      - typecheck
      - dependency-integrity
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      # One host's failure must not suppress another's result, and the source
      # suite failing must not hide which platforms still build.
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu latest x64
            runner: ubuntu-latest
            test: bun run test
            build: bun run build
            # The CLI smoke only, matching the other non-macOS host: the
            # compiled terminal suite is a darwin qualification.
            smoke: bun test src/main.compiled.test.ts
          - name: macOS latest arm64
            runner: macos-latest
            test: bun run test
            build: bun run build:macos-arm64
            # The CLI smoke and the compiled terminal suite on a real
            # pseudo-terminal. This is the only host that qualifies the shell.
            smoke: bun run smoke:macos-arm64
          - name: Windows latest x64
            runner: windows-latest
            test: bun run test:platform-baseline
            build: bun run build:windows-x64
            # The CLI smoke only. The compiled terminal suite allocates a
            # pseudo-terminal through libc's `openpty`, which Windows has no
            # equivalent for, so it stays a POSIX qualification rather than
            # being skipped here and mistaken for coverage.
            smoke: bun run smoke:windows-x64

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Run the platform test command
        run: ${{ matrix.test }}

      - name: Build the standalone executable
        run: ${{ matrix.build }}

      - name: Run the compiled smoke suite
        run: ${{ matrix.smoke }}

  benchmark:
    name: Benchmark regression (Ubuntu x64)
    needs:
      - typecheck
      - dependency-integrity
    # A push to `main` has no base to compare against, and this is the only job
    # here that needs two revisions rather than one.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the selected benchmark candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun for the selected benchmark candidate
        uses: ./.github/actions/setup-bun

      - name: Build the selected Ubuntu x64 candidate executable
        run: bun run build

      # The pull request's own base commit is the only base this measures
      # against, so the comparison is always this change versus what it targets.
      - name: Check out the benchmark base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          # This job uploads an artifact, and nothing here pushes. A token left
          # in `.git/config` is a credential nobody asked for.
          persist-credentials: false

      - name: Record the benchmark base revision
        id: base_revision
        working-directory: baseline
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require distinct benchmark revisions
        env:
          BENCHMARK_BASE_REVISION: ${{ steps.base_revision.outputs.sha }}
          BENCHMARK_CANDIDATE_REVISION: ${{ github.sha }}
        run: test "$BENCHMARK_BASE_REVISION" != "$BENCHMARK_CANDIDATE_REVISION"

      - name: Set up Bun for the base revision
        uses: ./.github/actions/setup-bun
        with:
          working-directory: baseline

      - name: Build the base Ubuntu x64 executable
        working-directory: baseline
        run: bun run build

      - name: Add the test-only report harness to the base checkout
        run: |
          cp src/data/measurement.test.ts baseline/src/data/measurement.test.ts
          cp tools/benchmark-regression.ts baseline/tools/benchmark-regression.ts

      - name: Warm the base revision before its first report
        id: base_first_warmup
        continue-on-error: true
        working-directory: baseline
        run: |
          bun run measure
          bun run measure
          echo "completed=2" >> "$GITHUB_OUTPUT"

      - name: Measure the base revision first
        id: base_first_measurement
        continue-on-error: true
        working-directory: baseline
        env:
          FALRYN_MEASURE_REPORT: ${{ runner.temp }}/falryn-benchmark-reports/base-first.json
          FALRYN_BENCHMARK_REVISION: ${{ steps.base_revision.outputs.sha }}
          FALRYN_BENCHMARK_TRIAL: base-first
          FALRYN_BENCHMARK_WARMUP_RUNS: ${{ steps.base_first_warmup.outputs.completed || 0 }}
        run: |
          mkdir -p "$RUNNER_TEMP/falryn-benchmark-reports"
          bun run measure && echo "completed=1" >> "$GITHUB_OUTPUT"

      - name: Move the base checkout outside reviewed test discovery
        run: mv baseline "$RUNNER_TEMP/falryn-benchmark-baseline"

      - name: Warm the reviewed revision before its first report
        id: candidate_first_warmup
        continue-on-error: true
        run: |
          bun run measure
          bun run measure
          echo "completed=2" >> "$GITHUB_OUTPUT"

      - name: Measure the reviewed revision first
        id: candidate_first_measurement
        continue-on-error: true
        env:
          FALRYN_MEASURE_REPORT: ${{ runner.temp }}/falryn-benchmark-reports/candidate-first.json
          FALRYN_BENCHMARK_REVISION: ${{ github.sha }}
          FALRYN_BENCHMARK_TRIAL: candidate-first
          FALRYN_BENCHMARK_WARMUP_RUNS: ${{ steps.candidate_first_warmup.outputs.completed || 0 }}
        run: bun run measure && echo "completed=1" >> "$GITHUB_OUTPUT"

      - name: Warm the reviewed revision before its second report
        id: candidate_second_warmup
        continue-on-error: true
        run: |
          bun run measure
          bun run measure
          echo "completed=2" >> "$GITHUB_OUTPUT"

      - name: Measure the reviewed revision second
        id: candidate_second_measurement
        continue-on-error: true
        env:
          FALRYN_MEASURE_REPORT: ${{ runner.temp }}/falryn-benchmark-reports/candidate-second.json
          FALRYN_BENCHMARK_REVISION: ${{ github.sha }}
          FALRYN_BENCHMARK_TRIAL: candidate-second
          FALRYN_BENCHMARK_WARMUP_RUNS: ${{ steps.candidate_second_warmup.outputs.completed || 0 }}
        run: bun run measure && echo "completed=1" >> "$GITHUB_OUTPUT"

      - name: Warm the base revision before its second report
        id: base_second_warmup
        continue-on-error: true
        working-directory: ${{ runner.temp }}/falryn-benchmark-baseline
        run: |
          bun run measure
          bun run measure
          echo "completed=2" >> "$GITHUB_OUTPUT"

      - name: Measure the base revision second
        id: base_second_measurement
        continue-on-error: true
        working-directory: ${{ runner.temp }}/falryn-benchmark-baseline
        env:
          FALRYN_MEASURE_REPORT: ${{ runner.temp }}/falryn-benchmark-reports/base-second.json
          FALRYN_BENCHMARK_REVISION: ${{ steps.base_revision.outputs.sha }}
          FALRYN_BENCHMARK_TRIAL: base-second
          FALRYN_BENCHMARK_WARMUP_RUNS: ${{ steps.base_second_warmup.outputs.completed || 0 }}
        run: bun run measure && echo "completed=1" >> "$GITHUB_OUTPUT"

      - name: Warm the base revision before its third report
        id: base_third_warmup
        continue-on-error: true
        working-directory: ${{ runner.temp }}/falryn-benchmark-baseline
        run: |
          bun run measure
          bun run measure
          echo "completed=2" >> "$GITHUB_OUTPUT"

      - name: Measure the base revision third
        id: base_third_measurement
        continue-on-error: true
        working-directory: ${{ runner.temp }}/falryn-benchmark-baseline
        env:
          FALRYN_MEASURE_REPORT: ${{ runner.temp }}/falryn-benchmark-reports/base-third.json
          FALRYN_BENCHMARK_REVISION: ${{ steps.base_revision.outputs.sha }}
          FALRYN_BENCHMARK_TRIAL: base-third
          FALRYN_BENCHMARK_WARMUP_RUNS: ${{ steps.base_third_warmup.outputs.completed || 0 }}
        run: bun run measure && echo "completed=1" >> "$GITHUB_OUTPUT"

      - name: Warm the reviewed revision before its third report
        id: candidate_third_warmup
        continue-on-error: true
        run: |
          bun run measure
          bun run measure
          echo "completed=2" >> "$GITHUB_OUTPUT"

      - name: Measure the reviewed revision third
        id: candidate_third_measurement
        continue-on-error: true
        env:
          FALRYN_MEASURE_REPORT: ${{ runner.temp }}/falryn-benchmark-reports/candidate-third.json
          FALRYN_BENCHMARK_REVISION: ${{ github.sha }}
          FALRYN_BENCHMARK_TRIAL: candidate-third
          FALRYN_BENCHMARK_WARMUP_RUNS: ${{ steps.candidate_third_warmup.outputs.completed || 0 }}
        run: bun run measure && echo "completed=1" >> "$GITHUB_OUTPUT"

      - name: Warm the reviewed revision before its fourth report
        id: candidate_fourth_warmup
        continue-on-error: true
        run: |
          bun run measure
          bun run measure
          echo "completed=2" >> "$GITHUB_OUTPUT"

      - name: Measure the reviewed revision fourth
        id: candidate_fourth_measurement
        continue-on-error: true
        env:
          FALRYN_MEASURE_REPORT: ${{ runner.temp }}/falryn-benchmark-reports/candidate-fourth.json
          FALRYN_BENCHMARK_REVISION: ${{ github.sha }}
          FALRYN_BENCHMARK_TRIAL: candidate-fourth
          FALRYN_BENCHMARK_WARMUP_RUNS: ${{ steps.candidate_fourth_warmup.outputs.completed || 0 }}
        run: bun run measure && echo "completed=1" >> "$GITHUB_OUTPUT"

      - name: Warm the base revision before its fourth report
        id: base_fourth_warmup
        continue-on-error: true
        working-directory: ${{ runner.temp }}/falryn-benchmark-baseline
        run: |
          bun run measure
          bun run measure
          echo "completed=2" >> "$GITHUB_OUTPUT"

      - name: Measure the base revision fourth
        id: base_fourth_measurement
        continue-on-error: true
        working-directory: ${{ runner.temp }}/falryn-benchmark-baseline
        env:
          FALRYN_MEASURE_REPORT: ${{ runner.temp }}/falryn-benchmark-reports/base-fourth.json
          FALRYN_BENCHMARK_REVISION: ${{ steps.base_revision.outputs.sha }}
          FALRYN_BENCHMARK_TRIAL: base-fourth
          FALRYN_BENCHMARK_WARMUP_RUNS: ${{ steps.base_fourth_warmup.outputs.completed || 0 }}
        run: bun run measure && echo "completed=1" >> "$GITHUB_OUTPUT"

      - name: Compare the reports
        if: always()
        env:
          FALRYN_BENCHMARK_BASE_FIRST_REPORT: ${{ runner.temp }}/falryn-benchmark-reports/base-first.json
          FALRYN_BENCHMARK_CANDIDATE_FIRST_REPORT: ${{ runner.temp }}/falryn-benchmark-reports/candidate-first.json
          FALRYN_BENCHMARK_CANDIDATE_SECOND_REPORT: ${{ runner.temp }}/falryn-benchmark-reports/candidate-second.json
          FALRYN_BENCHMARK_BASE_SECOND_REPORT: ${{ runner.temp }}/falryn-benchmark-reports/base-second.json
          FALRYN_BENCHMARK_CANDIDATE_THIRD_REPORT: ${{ runner.temp }}/falryn-benchmark-reports/candidate-third.json
          FALRYN_BENCHMARK_BASE_THIRD_REPORT: ${{ runner.temp }}/falryn-benchmark-reports/base-third.json
          FALRYN_BENCHMARK_BASE_FOURTH_REPORT: ${{ runner.temp }}/falryn-benchmark-reports/base-fourth.json
          FALRYN_BENCHMARK_CANDIDATE_FOURTH_REPORT: ${{ runner.temp }}/falryn-benchmark-reports/candidate-fourth.json
          FALRYN_BENCHMARK_BASE_FIRST_COMPLETED: ${{ steps.base_first_measurement.outputs.completed || 0 }}
          FALRYN_BENCHMARK_CANDIDATE_FIRST_COMPLETED: ${{ steps.candidate_first_measurement.outputs.completed || 0 }}
          FALRYN_BENCHMARK_CANDIDATE_SECOND_COMPLETED: ${{ steps.candidate_second_measurement.outputs.completed || 0 }}
          FALRYN_BENCHMARK_BASE_SECOND_COMPLETED: ${{ steps.base_second_measurement.outputs.completed || 0 }}
          FALRYN_BENCHMARK_CANDIDATE_THIRD_COMPLETED: ${{ steps.candidate_third_measurement.outputs.completed || 0 }}
          FALRYN_BENCHMARK_BASE_THIRD_COMPLETED: ${{ steps.base_third_measurement.outputs.completed || 0 }}
          FALRYN_BENCHMARK_BASE_FOURTH_COMPLETED: ${{ steps.base_fourth_measurement.outputs.completed || 0 }}
          FALRYN_BENCHMARK_CANDIDATE_FOURTH_COMPLETED: ${{ steps.candidate_fourth_measurement.outputs.completed || 0 }}
        run: bun run benchmark:compare

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ubuntu-x64-benchmark-reports-${{ github.run_id }}
          path: ${{ runner.temp }}/falryn-benchmark-reports
          if-no-files-found: warn
