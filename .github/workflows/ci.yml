name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A newer push to a pull request replaces its run. Pushes to `main` never cancel one
# another, so every merged revision keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Chooses how much this revision needs: `docs` runs the static checks only, `scoped`
  # runs the tests that can reach the change, `full` runs everything. The rule is
  # tools/quality/ci-profile.ts. Any doubt, and every push to `main`, selects `full`.
  classify:
    name: Choose what to test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      profile: ${{ steps.profile.outputs.profile }}

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the base revision
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE"

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun
        with:
          install: ${{ github.event_name == 'pull_request' }}

      - name: Classify the change
        id: profile
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: bun run tools/quality/ci-profile.ts --event "$EVENT" ${BASE:+--base "$BASE"}

  checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Formatting, lint, types, repository integrity and model catalogs
        run: bun run check:static

      - name: Audit installed dependencies for known vulnerabilities
        run: bun audit

  # The source suite through `bun run test`, the same runner, shard balance and
  # known-flake retry as a local run, one shard per job and each shard's files run
  # serially. Each job records its files' durations for the next rebalance. Shard processes side by side on one runner were slower on macOS (three
  # cores) and failed timing-sensitive tests on Ubuntu. A scoped revision runs
  # `bun run test:changed` against the pull request's base, exactly as a local
  # `bun run check` does against `main`.
  test:
    name: Tests (${{ matrix.name }}, shard ${{ matrix.shard }})
    needs: classify
    if: ${{ needs.classify.outputs.profile != 'docs' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Ubuntu x64, os: ubuntu-latest, platform: linux, shard: 1/3 }
          - { name: Ubuntu x64, os: ubuntu-latest, platform: linux, shard: 2/3 }
          - { name: Ubuntu x64, os: ubuntu-latest, platform: linux, shard: 3/3 }
          - { name: macOS arm64, os: macos-latest, platform: darwin, shard: 1/4 }
          - { name: macOS arm64, os: macos-latest, platform: darwin, shard: 2/4 }
          - { name: macOS arm64, os: macos-latest, platform: darwin, shard: 3/4 }
          - { name: macOS arm64, os: macos-latest, platform: darwin, shard: 4/4 }
    env:
      FALRYN_TEST_SHARD: ${{ matrix.shard }}
      FALRYN_RECORD_TIMINGS: "1"

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the base revision as main
        if: ${{ needs.classify.outputs.profile == 'scoped' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "+$BASE:refs/heads/main"

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Run the ${{ needs.classify.outputs.profile }} source suite
        run: bun run ${{ needs.classify.outputs.profile == 'full' && 'test' || 'test:changed' }}

      # This shard's measured per-file durations; `bun run test:timings` merges a `main`
      # run's shards into .github/test-timings/ to rebalance them.
      - name: Upload this shard's test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-timings-${{ matrix.platform }}-${{ strategy.job-index }}
          path: .github/test-timings/${{ matrix.platform }}.json
          retention-days: 14
          if-no-files-found: ignore

  # Windows runs a baseline, not the full suite: parts of it assert POSIX signal and
  # permission behavior Windows does not have. See README.md.
  windows:
    name: Tests (Windows x64, baseline)
    needs: classify
    if: ${{ needs.classify.outputs.profile != 'docs' }}
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Run the Windows platform baseline
        run: bun run test:platform-baseline

  # Each target builds and runs its own executable. A smoke that names its target fails,
  # rather than skips, when the executable is missing or reports another platform.
  compiled:
    name: Build and smoke test (${{ matrix.name }})
    needs: classify
    if: ${{ needs.classify.outputs.profile != 'docs' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu x64
            os: ubuntu-latest
            build: build
            smoke: smoke:linux-x64
          - name: macOS arm64
            os: macos-latest
            build: build:macos-arm64
            smoke: smoke:macos-arm64
          - name: Windows x64
            os: windows-latest
            build: build:windows-x64
            smoke: smoke:windows-x64

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Build the standalone executable
        run: bun run ${{ matrix.build }}

      - name: Run the compiled smoke suites
        run: bun run ${{ matrix.smoke }}

  # The one CI check branch protection requires. It always runs and passes only when every job succeeded,
  # except the test jobs a documentation-only revision skips. A failed classifier, a
  # cancelled job or an unexpected skip fails it.
  required:
    name: All CI checks
    needs:
      - classify
      - checks
      - test
      - windows
      - compiled
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every job this tier needs
        env:
          PROFILE: ${{ needs.classify.outputs.profile }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "CI tier: ${PROFILE:-unknown}"
          failed=$(jq -r --arg profile "$PROFILE" '
            to_entries[]
            | select(.value.result != "success")
            | select(($profile == "docs" and .value.result == "skipped"
                      and (.key | IN("test", "windows", "compiled"))) | not)
            | "\(.key): \(.value.result)"' <<<"$NEEDS")
          if [ -n "$failed" ]; then
            echo "$failed"
            exit 1
          fi
