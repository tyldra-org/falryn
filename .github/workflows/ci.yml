name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Check formatting
        run: bun run format:check

  lint:
    name: Lint and import organization
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Run Biome quality checks
        run: bun run quality

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Run the strict TypeScript check
        run: bun run typecheck

  dependency-integrity:
    name: Dependency integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Verify direct dependency and generated-output ownership
        run: bun run verify:repository

  dependency-audit:
    name: Dependency advisory audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Audit installed dependencies for known vulnerabilities
        run: bun audit

  # The complete source suite is split into balanced shards per host. Bun's
  # --shard assigns files by the recorded durations in .github/test-timings.json
  # (refresh with `bun run test:timings`); a file missing from it still runs.
  # The gate jobs below keep the required check names stable.
  platform-test-ubuntu:
    name: Platform tests shard (Ubuntu latest x64, ${{ matrix.shard }}/3)
    needs:
      - typecheck
      - dependency-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Run this shard of the source suite
        run: bun test --shard=${{ matrix.shard }}/3 --timings=.github/test-timings.json

  platform-test-macos:
    name: Platform tests shard (macOS latest arm64, ${{ matrix.shard }}/3)
    needs:
      - typecheck
      - dependency-integrity
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Run this shard of the source suite
        run: bun test --shard=${{ matrix.shard }}/3 --timings=.github/test-timings.json

  platform-test-windows:
    name: Platform tests (Windows latest x64)
    needs:
      - typecheck
      - dependency-integrity
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Run the platform test command
        run: bun run test:platform-baseline

  # Required-check gates. They always run, so a skipped or failed shard (for
  # example after a failed typecheck) fails the required check instead of
  # leaving it pending or passing.
  platform-test-ubuntu-gate:
    name: Platform tests (Ubuntu latest x64)
    needs: platform-test-ubuntu
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every Ubuntu shard to pass
        run: test "${{ needs.platform-test-ubuntu.result }}" = success

  platform-test-macos-gate:
    name: Platform tests (macOS latest arm64)
    needs: platform-test-macos
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every macOS shard to pass
        run: test "${{ needs.platform-test-macos.result }}" = success

  ubuntu-x64-compiled-smoke:
    name: Ubuntu x64 compiled smoke
    needs:
      - typecheck
      - dependency-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Build the standalone executable
        run: bun run build

      - name: Run the compiled CLI smoke suite
        run: bun test src/main.compiled.test.ts

  macos-arm64-compiled-smoke:
    name: macOS arm64 compiled smoke
    needs:
      - typecheck
      - dependency-integrity
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Build the macOS arm64 standalone executable
        run: bun run build:macos-arm64

      - name: Run the macOS arm64 compiled smoke suites
        run: bun run smoke:macos-arm64

  windows-x64-compiled-smoke:
    name: Windows x64 compiled smoke
    needs:
      - typecheck
      - dependency-integrity
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Build the Windows x64 standalone executable
        run: bun run build:windows-x64

      # The CLI smoke only. The compiled terminal suite allocates a
      # pseudo-terminal through libc's `openpty`, which Windows has no
      # equivalent for, so it stays a POSIX qualification rather than being
      # skipped here and mistaken for coverage.
      - name: Run the Windows x64 compiled smoke suite
        run: bun run smoke:windows-x64

