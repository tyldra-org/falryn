# Falryn pins every action to a full commit SHA, which the organization
# requires. A pinned SHA cannot go stale visibly: it keeps resolving long after
# the release it names has been superseded, so an update has to be scheduled
# rather than noticed.
#
# Bun package updates are enabled via `package-ecosystem: bun`. Direct
# dependency bumps still have to pass `bun run tools/repository-integrity.ts`
# (update `DIRECT_DEPENDENCY_POLICY` in that file with the PR). OpenTUI bumps
# also need the type-only patches under `patches/` regenerated for the new
# version — Dependabot cannot do that step.
#
# Bun itself (`packageManager` / `engines.bun`) is not a package Dependabot
# updates; bump that pin when adopting a new Bun runtime.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - "type: infrastructure"

  # Also covers `.github/actions/setup-bun`: Dependabot treats a composite
  # action as its own manifest, so the pin owned there is updated too.
  - package-ecosystem: github-actions
    directory: /.github/actions/setup-bun
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - "type: infrastructure"

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    labels:
      - "type: infrastructure"
    groups:
      opentui:
        patterns:
          - "@opentui/*"
      production-deps:
        dependency-type: production
        exclude-patterns:
          - "@opentui/*"
      development-deps:
        dependency-type: development
