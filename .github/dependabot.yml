# Falryn pins every action to a full commit SHA, which the organization
# requires. A pinned SHA cannot go stale visibly: it keeps resolving long after
# the release it names has been superseded, so an update has to be scheduled
# rather than noticed.
#
# Bun / package ecosystems are intentionally omitted: direct dependency bumps
# are admitted by `bun run tools/repository-integrity.ts` and stay manual (or
# a later Dependabot entry) so noisy OpenTUI-style PRs do not land every week.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - "type: infrastructure"

  # Also covers `.github/actions/setup-bun`: Dependabot treats a composite
  # action as its own manifest, so the pin owned there is updated too.
  - package-ecosystem: github-actions
    directory: /.github/actions/setup-bun
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - "type: infrastructure"
