# Falryn pins every action to a full commit SHA, which the organization
# requires. A pinned SHA cannot go stale visibly: it keeps resolving long after
# the release it names has been superseded, so an update has to be scheduled
# rather than noticed.
#
# Once a week, one pull request for every action pin (including the composite
# action under .github/actions) and one each for production and development
# packages. A release must be three days old before it is proposed, so a
# compromised or withdrawn release has time to be caught. Security updates
# ignore both the schedule and the wait.
#
# `package.json` owns every package version. A version update needs no other
# edit; a new license, repository, install hook or dependency group fails
# `bun run verify:repository` until `tools/quality/repository-integrity.ts`
# admits it. Dependabot does not bump the Bun runtime (`packageManager` /
# `engines.bun`); change that pin when adopting a new Bun.
version: 2

updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
    labels:
      - "type: infrastructure"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    labels:
      - "type: infrastructure"
    groups:
      production-dependencies:
        dependency-type: production
        patterns:
          - "*"
      development-dependencies:
        dependency-type: development
        patterns:
          - "*"
