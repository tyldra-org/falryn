name: Set up Bun
description: >-
  Install the manifest-selected Bun version and the frozen dependency set.

  Every job in this repository needs the same three steps, and they must stay
  identical: a job that resolved a different Bun version or an unfrozen
  dependency set would report a result the other jobs cannot be compared with.
  Owning them here makes that one edit rather than nine, and gives a
  per-platform install flag somewhere to live.

inputs:
  install:
    description: >-
      Whether to install dependencies. Set to "false" for a job that only needs
      the Bun runtime, so it does not pay for a dependency tree it never reads.
    required: false
    default: "true"
  working-directory:
    description: >-
      The checkout to read the manifest from and install into. The benchmark
      comparison places a second revision in its own directory, and that
      revision must select its own Bun version rather than inherit the
      candidate's — otherwise the two sides are not comparable.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Set up Bun from package.json
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ${{ inputs.working-directory }}/package.json

    - name: Install locked dependencies
      if: inputs.install == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bun install --frozen-lockfile
